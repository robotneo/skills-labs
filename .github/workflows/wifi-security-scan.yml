name: Wi-Fi skill security
on:
  push:
    paths: ['wifi-health-detector/**', 'scripts/package_wifi_skill.py', '.github/workflows/wifi-security-scan.yml']
  pull_request:
    paths: ['wifi-health-detector/**', 'scripts/package_wifi_skill.py', '.github/workflows/wifi-security-scan.yml']
permissions:
  contents: read
jobs:
  nacos-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scanner
        run: python -m pip install cisco-ai-skill-scanner==2.2.1
      - name: Build and unpack complete runtime package
        run: |
          python scripts/package_wifi_skill.py --output dist/wifi-health-detector.zip
          python -m zipfile -e dist/wifi-health-detector.zip dist/release
      - name: Scan with Nacos default options
        run: |
          set -o pipefail
          skill-scanner --version
          skill-scanner scan dist/release/wifi-health-detector --fail-on-severity high --lenient --format markdown --detailed | tee scan-report.md
      - name: Save scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wifi-security-report
          path: |
            scan-report.md
            dist/wifi-health-detector.zip
