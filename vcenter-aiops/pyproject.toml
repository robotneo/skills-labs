[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vcenter-aiops"
version = "3.0.0b4"
description = "面向 AI Agent 的原子化 vCenter 运维 CLI"
requires-python = ">=3.10"
dependencies = ["pyvmomi>=8.0.3,<10", "PyYAML>=6,<7"]

[project.optional-dependencies]
secrets = ["cryptography>=48.0.1,<49"]

[project.scripts]
vcenter-aiops = "vcenter_aiops.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
