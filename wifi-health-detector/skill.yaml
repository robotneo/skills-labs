skill_id: wifi-health-detector
name: 无线网络健康检测
version: 2.6.1
author: hua
description: 检测 macOS 10.12+ 与 Windows 10/11 的完整 Wi-Fi、射频、IP、本地及公网质量，并输出带置信度的诊断建议。
support_os: [macos-10.12+, windows-10, windows-11]
entry: run.sh (macOS) / run.bat (Windows)
runtime_fallback: [python-3.7+, os-native, node-16+]
output_format: [text, json-schema-2.0, csv]
optional_component: integrations/enterprise-notification-bridge
notification_enabled_by_default: false
repo: https://github.com/robotneo/skills-labs/tree/main/wifi-health-detector
